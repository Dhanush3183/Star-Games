<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Games - Create Room</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-particles" id="particles"></div>
    <div class="container glass-panel animate-in">
        <button class="btn btn-icon btn-back" onclick="navBack()">⬅️ Back</button>
        
        <header class="text-center">
            <h1 class="main-title gradient-text">Create Room</h1>
            <p class="subtitle">Host a new game for your friends.</p>
        </header>

        <main>
            <div class="form-group">
                <label>Number Of Players</label>
                <div class="radio-group">
                    <label class="radio-card">
                        <input type="radio" name="maxPlayers" value="2" checked>
                        <div class="card-content">
                            <span class="icon">👥</span>
                            <span>2 Players</span>
                        </div>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="maxPlayers" value="3">
                        <div class="card-content">
                            <span class="icon">🗣️</span>
                            <span>3 Players</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Game (Optional)</label>
                <input type="hidden" name="selectedGame" id="selectedGameInput" value="">
                <button type="button" class="btn btn-secondary btn-block" id="btnChooseGame" onclick="openGameModal()" style="height: 60px; font-size: 1.2rem; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);">
                    <div id="chooseGameText" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <span class="icon">🎮</span> Choose A Game
                    </div>
                </button>
            </div>

            <div class="action-buttons mt-2">
                <button class="btn btn-primary btn-block" id="btnCreate" onclick="handleCreate()">
                    Create Room 🚀
                </button>
            </div>
            
            <div id="createError" class="error-text text-center mt-1"></div>
        </main>
    </div>

    <!-- Game Selection Modal -->
    <div class="overlay" id="gameSelectModal" style="display: none;">
        <div class="overlay-content text-center" style="max-width: 600px; width: 90%;">
            <h2 class="gradient-text mb-2">Select a Game</h2>
            <div class="games-radio-grid">
                <div class="radio-card game-radio" onclick="selectGame('', '❓', 'Choose Later')">
                    <div class="card-content">
                        <span class="icon">❓</span>
                        <span>Choose Later</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('chainReaction', '⚛️', 'Chain Reaction')">
                    <div class="card-content">
                        <span class="icon">⚛️</span>
                        <span>Chain Reaction</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('ticTacToe', '❌⭕', 'Tic Tac Toe')">
                    <div class="card-content">
                        <span class="icon">❌⭕</span>
                        <span>Tic Tac Toe</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('connectFour', '🔴🟡', 'Connect Four')">
                    <div class="card-content">
                        <span class="icon">🔴🟡</span>
                        <span>Connect Four</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('drawAndGuess', '🎨', 'Draw & Guess')">
                    <div class="card-content">
                        <span class="icon">🎨</span>
                        <span>Draw & Guess</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('spikeAttack', '⚔️', 'Spike Attack')">
                    <div class="card-content">
                        <span class="icon">⚔️</span>
                        <span>Spike Attack</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('memoryCards', '🃏', 'Memory Cards')">
                    <div class="card-content">
                        <span class="icon">🃏</span>
                        <span>Memory Cards</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('uno', '🃏', 'UNO')">
                    <div class="card-content">
                        <span class="icon">🃏</span>
                        <span>UNO</span>
                    </div>
                </div>
                <div class="radio-card game-radio" onclick="selectGame('ludo', '🎲', 'Ludo')">
                    <div class="card-content">
                        <span class="icon">🎲</span>
                        <span>Ludo</span>
                    </div>
                </div>
            </div>
            <button class="btn btn-secondary mt-2" onclick="closeGameModal()">Cancel</button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        initParticles();
        checkNickname(); // Ensure nickname exists

        function navBack() {
            playSound('click');
            window.location.href = 'index.html';
        }

        function handleCreate() {
            playSound('click');
            const maxPlayers = document.querySelector('input[name="maxPlayers"]:checked').value;
            const selectedGame = document.getElementById('selectedGameInput').value;
            
            // Store preferences in sessionStorage to be read by lobby.html or handle socket creation here
            // Actually, we should just redirect to lobby with params or store intent.
            // Let's store intent in sessionStorage and let lobby.html handle the socket connection.
            sessionStorage.setItem('action', 'create');
            sessionStorage.setItem('maxPlayers', maxPlayers);
            if(selectedGame) sessionStorage.setItem('selectedGame', selectedGame);
            
            window.location.href = 'lobby.html';
        }

        function openGameModal() {
            playSound('click');
            document.getElementById('gameSelectModal').style.display = 'flex';
        }

        function closeGameModal() {
            playSound('click');
            document.getElementById('gameSelectModal').style.display = 'none';
        }

        function selectGame(value, icon, text) {
            playSound('click');
            document.getElementById('selectedGameInput').value = value;
            document.getElementById('chooseGameText').innerHTML = `<span class="icon">${icon}</span> ${text}`;
            document.getElementById('gameSelectModal').style.display = 'none';
        }
    </script>
</body>
</html>
